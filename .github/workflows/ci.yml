name: CI — Validacion rapida

on:
  pull_request:
    branches:
      - dev
      - main
      - sprint/**

jobs:
  validate-react:
    name: Lint y Build React
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: game-client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: game-client
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: game-client
        run: pnpm lint

      - name: Build
        working-directory: game-client
        run: pnpm build
